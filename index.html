<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مفاجأة 💌</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffe3ec;
      font-family: sans-serif;
    }
    button {
      font-size: 24px;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #ff4d79;
      color: white;
      cursor: pointer;
    }
    #msg {
      margin-top: 30px;
      font-size: 36px;
      color: #d6336c;
    }
  </style>
</head>
<body>
  <button onclick="document.getElementById('msg').innerText = ' بحبك جدا يا معاذذذ ❤️'">
    دوس هنا 💌
  </button>
  <div id="msg"></div>
</body>
</html>
